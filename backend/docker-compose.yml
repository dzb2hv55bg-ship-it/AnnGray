services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: momento
      POSTGRES_USER: momento
      POSTGRES_PASSWORD: momento_local_only
    ports:
      - "5432:5432"
    volumes:
      - momento_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momento -d momento"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  momento_postgres:
