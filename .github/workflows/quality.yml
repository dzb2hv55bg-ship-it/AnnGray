name: MOMENTO quality gates
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history for credentials (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reminder-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin CLI for isolated pure-Kotlin behavioural checks
        run: |
          curl -fsSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - run: bash scripts/run_reminder_invariants.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - run: python3 scripts/test_upload_queue_migration.py
      - run: python3 scripts/verify_project.py
      - run: python3 scripts/check_reference_integrity.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: momento_ci
          POSTGRES_USER: momento_ci
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momento_ci -d momento_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MOMENTO_TEST_DATABASE_URL: postgresql://momento_ci:ci_ephemeral_only@localhost:5432/momento_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - run: bash scripts/apply-test-migrations.sh
        working-directory: backend
      - name: PostgreSQL integration tests (preserve full output)
        shell: bash
        working-directory: backend
        run: |
          set -o pipefail
          node --test test/postgres-live-vlog.integration.test.js 2>&1 | tee postgres-integration.log
      - name: Upload PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOMENTO-postgres-integration-log
          path: backend/postgres-integration.log
          if-no-files-found: warn

  android-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: bash gradlew assembleDebug lintDebug testDebugUnitTest -PmomentoAllowOfflinePreview=true -PmomentoRequireLiveAuth=false
      - uses: actions/upload-artifact@v4
        with:
          name: MOMENTO-offline-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash gradlew connectedDebugAndroidTest -PmomentoAllowOfflinePreview=true -PmomentoRequireLiveAuth=false
