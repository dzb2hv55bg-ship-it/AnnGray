[versions]
agp = "9.1.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
coreKtx = "1.19.1"
camera = "1.7.0"
junit = "4.13.2"
work = "2.10.5"
credentials = "1.6.0"
googleid = "1.2.1"
yandexAuth = "3.1.3"
vkid = "2.7.3"
media3 = "1.8.0"

[libraries]
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
